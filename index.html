<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" TypeError in modern browser runtimes
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            // Redefine on window
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
            // Redefine on globalThis
            if (typeof globalThis !== 'undefined') {
              Object.defineProperty(globalThis, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          console.warn("Failed to redefine window.fetch to be writable:", e);
        }
        
        // Define global on window to prevent Node-targeted libraries from crashing in browser
        try {
          if (typeof window.global === 'undefined') {
            window.global = window;
          }
        } catch (e) {}
      })();
    </script>
